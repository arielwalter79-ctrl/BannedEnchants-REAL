name: Build NoBannedEnchants

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: "NoBannedEnchants (1)/NoBannedEnchants"
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NoBannedEnchants
          path: "NoBannedEnchants (1)/NoBannedEnchants/build/libs/*.jar"
